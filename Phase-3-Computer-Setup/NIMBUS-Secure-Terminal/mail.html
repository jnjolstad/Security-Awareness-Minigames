<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail &middot; NIMBUS Secure Terminal</title>
<link rel="stylesheet" href="assets/css/nimbus.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo"></span> NIMBUS <small>MAIL</small></div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
  <a class="btn ghost" href="desktop.html">&larr; Desktop</a>
</div>

<div class="wrap">
  <div class="panel">
    <h2>Incident Evidence Mailbox</h2>
    <div class="sub"><span id="victim"></span> received the message that opened the door. Spot the phish and <b>Report</b> it.</div>

    <div class="mail" style="margin-top:14px">
      <div class="mlist" id="list"></div>
      <div class="mbody" id="body">
        <p class="note">Select a message to read it.</p>
      </div>
    </div>
    <div class="msg" id="m" style="margin-top:14px"></div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script>
  NST.require("mfa");
  NST.bindClock("clock");
  document.getElementById("victim").textContent = NIMBUS_CONFIG.phishVictim;

  var list = document.getElementById("list");
  var body = document.getElementById("body");
  var active = null;

  NIMBUS_CONFIG.emails.forEach(function (mail) {
    var it = document.createElement("div");
    it.className = "mitem";
    it.innerHTML = '<div class="from">' + NST.esc(mail.from) + '</div>' +
                   '<div class="subj">' + NST.esc(mail.subject) + '</div>';
    it.addEventListener("click", function () {
      if (active) active.classList.remove("active");
      it.classList.add("active"); active = it;
      render(mail);
    });
    list.appendChild(it);
  });

  function render(mail) {
    body.innerHTML =
      '<div class="hd"><div class="from">From: ' + NST.esc(mail.from) + '</div>' +
      '<div style="font-weight:700;margin-top:4px">' + NST.esc(mail.subject) + '</div></div>' +
      '<div style="white-space:pre-wrap">' + NST.esc(mail.body) + '</div>' +
      '<div class="btnrow" style="margin-top:16px">' +
      '<button class="btn bad" id="rep">&#9873; Report Phishing</button>' +
      '<span class="note">Not sure? Check the sender domain against <span class="mono">nimbuscloud.com</span>.</span></div>';
    document.getElementById("rep").addEventListener("click", function () { report(mail); });
  }

  function report(mail) {
    if (mail.id === NIMBUS_CONFIG.phishId) {
      NST.mark("phish");
      NST.show("m", "good",
        "&#9989; <b>Phishing reported.</b> Forensics: this message dropped a hidden folder " +
        "<b>BF_" + NIMBUS_CONFIG.hiddenFolderCode + "</b> in <a href='files.html'>Files</a>. Open it.");
    } else {
      NST.show("m", "err",
        "That message is legitimate (sender ends in <span class='mono'>nimbuscloud.com</span>). " +
        "Re-read the headers &mdash; the phish has a <b>look-alike</b> domain and a 24-hour threat.");
    }
  }
</script>
</body>
</html>
