<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files &middot; NIMBUS Secure Terminal</title>
<link rel="stylesheet" href="assets/css/nimbus.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo"></span> NIMBUS <small>FILES</small></div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
  <a class="btn ghost" href="desktop.html">&larr; Desktop</a>
</div>

<div class="wrap">
  <div class="grid" style="grid-template-columns:280px 1fr;gap:14px">
    <div class="panel">
      <h2 style="font-size:15px">Locations</h2>
      <div class="tree" id="tree"></div>
    </div>
    <div class="panel" id="view">
      <p class="note">Select a location to inspect it.</p>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script>
  NST.require("mfa");
  NST.bindClock("clock");
  var C = NIMBUS_CONFIG, view = document.getElementById("view"), tree = document.getElementById("tree");

  function nodes() {
    return [
      { key:"public",   label:"\uD83D\uDCC1 Public",            show:true },
      { key:"internal", label:"\uD83D\uDCC1 Internal",          show:true },
      { key:"confid",   label:"\uD83D\uDD34 Confidential",      show:true,  lock:!NST.has("accuse") },
      { key:"hidden",   label:"\uD83D\uDC7B BF_"+C.hiddenFolderCode+" (hidden)", show:NST.has("phish") },
      { key:"usb",      label:"\uD83D\uDD0C PROJECT FROST (USB)", show:NST.has("phish") },
      { key:"badge",    label:"\uD83D\uDCCB Badge Access Log",  show:true },
      { key:"accuseB",  label:"\uD83D\uDD75\uFE0F Suspect Board", show:true, lock:!NST.has("rogue") }
    ];
  }

  function renderTree() {
    tree.innerHTML = "";
    nodes().forEach(function (n) {
      if (!n.show) return;
      var el = document.createElement("div");
      el.className = "node" + (n.lock ? " lock" : "");
      el.textContent = n.label;
      el.addEventListener("click", function () { open(n); });
      tree.appendChild(el);
    });
  }

  function open(n) {
    switch (n.key) {
      case "public":
        view.innerHTML = head("\uD83D\uDCC1 Public") +
          fileRows(["brand_guidelines.pdf","office_map.png","press_release_q1.docx"]) +
          '<p class="note" style="margin-top:14px">\uD83D\uDFE2 Classification: <b>PUBLIC</b> \u2014 approved for external sharing.</p>';
        break;
      case "internal":
        view.innerHTML = head("\uD83D\uDCC1 Internal") +
          fileRows(["team_rota.xlsx","wifi_setup_guide.docx","vpn_instructions.pdf"]) +
          '<p class="note" style="margin-top:14px">\uD83D\uDFE0 Classification: <b>INTERNAL</b> \u2014 staff only.</p>';
        break;
      case "confid":
        if (!NST.has("accuse")) {
          view.innerHTML = head("\uD83D\uDD34 Confidential") +
            '<div class="msg show err">\uD83D\uDD12 ACCESS RESTRICTED \u2014 every open is logged. ' +
            'Identify the insider on the <b>Suspect Board</b> first.</div>';
        } else {
          view.innerHTML = head("\uD83D\uDD34 Confidential") +
            '<div class="msg show good">' + NST.esc(C.exfilAlert) + '</div>';
        }
        break;
      case "hidden":
        view.innerHTML = head("\uD83D\uDC7B BF_"+C.hiddenFolderCode) +
          '<pre class="mono" style="white-space:pre-wrap">readme_findme.txt\n\n' +
          'Loader staged from REMOVABLE MEDIA labeled "PROJECT FROST".\n' +
          'Alex hid the drive \u2014 check UNDER THE EVIDENCE SHELF.\n' +
          'Then examine it here under "PROJECT FROST (USB)".</pre>';
        break;
      case "usb":
        NST.mark("usb"); renderTree();
        var html = head("\uD83D\uDD0C PROJECT FROST \u2014 Evidence Viewer (air-gapped)");
        Object.keys(C.usbFiles).forEach(function (fn) {
          html += '<div class="kicker" style="margin-top:12px">'+NST.esc(fn)+'</div>' +
                  '<pre class="mono" style="white-space:pre-wrap;background:#0a1322;border:1px solid var(--line);'+
                  'border-radius:8px;padding:12px">' + NST.esc(C.usbFiles[fn]) + '</pre>';
        });
        view.innerHTML = html;
        break;
      case "badge":
        var rows = C.badgeLog.map(function (b) {
          var denied = /DENIED/.test(b.result);
          return '<tr><td class="mono">'+b.time+'</td><td>'+NST.esc(b.name)+
            '</td><td class="mono">'+b.badge+'</td><td>'+NST.esc(b.area)+'</td><td '+
            (denied?'style="color:var(--bad)"':'')+'>'+NST.esc(b.result)+'</td></tr>';
        }).join("");
        view.innerHTML = head("\uD83D\uDCCB Access Control Audit") +
          '<p class="note"><b>Incident timeline:</b> 09:14 \u2014 rogue AP first detected at the SOC contractor bench. ' +
          '02:30 \u2014 bulk transfer detected from the Server Room file segment.</p>' +
          '<table><tr><th>When</th><th>Name</th><th>Badge</th><th>Area / action</th><th>Result</th></tr>'+rows+'</table>';
        break;
      case "accuseB":
        if (!NST.has("rogue")) {
          view.innerHTML = head("\uD83D\uDD75\uFE0F Suspect Board") +
            '<div class="msg show err">\uD83D\uDD12 Complete the network investigation before making an accusation.</div>';
          break;
        }
        var sus = C.suspects.map(function (s) {
          return '<tr><td>'+NST.esc(s.name)+'</td><td class="mono">'+s.badge+'</td><td>'+
            NST.esc(s.role)+'</td><td class="note">'+NST.esc(s.note)+'</td></tr>';
        }).join("");
        view.innerHTML = head("\uD83D\uDD75\uFE0F Suspect Board") +
          '<table><tr><th>Name</th><th>Badge/ID</th><th>Role</th><th>Notes</th></tr>'+sus+'</table>' +
          '<label for="acc" style="margin-top:14px">Enter the ID of the insider</label>' +
          '<div class="btnrow"><input class="input" id="acc" placeholder="e.g. EMP-0000 / EXT-0000" style="max-width:260px">' +
          '<button class="btn" id="accBtn">Accuse</button></div>' +
          '<div class="msg" id="am"></div>';
        document.getElementById("accBtn").addEventListener("click", accuse);
        break;
    }
  }

  function accuse() {
    if (!NST.has("rogue")) {
      NST.show("am","err","Complete the network investigation before making an accusation.");
      return;
    }
    var v = NST.norm(document.getElementById("acc").value);
    if (!v) {
      NST.show("am","err","Enter a badge or contractor ID from the records.");
      return;
    }
    if (v === NST.norm(C.insiderId)) {
      NST.mark("accuse"); renderTree();
      NST.show("am","good","\u2705 IDENTITY CONFIRMED: <b>"+C.insiderName+" ("+C.insiderId+")</b>. " +
        "The \uD83D\uDD34 Confidential folder is now readable \u2014 get the cloud bucket number.");
      return;
    }
    var match = C.suspects.filter(function (s) { return NST.norm(s.badge) === v; })[0];
    if (match) { NST.show("am","err", NST.esc(match.verdict)); }
    else { NST.show("am","err","No such badge/ID in the records. Re-check the Badge Access Log."); }
  }

  function head(t){ return '<h2>'+t+'</h2>'; }
  function fileRows(arr){ return '<div class="tree" style="margin-top:8px">' +
    arr.map(function(f){return '<div class="node" style="cursor:default">\uD83D\uDCC4 '+NST.esc(f)+'</div>';}).join("")+'</div>'; }
  function tagNote(cls,html){ return '<p class="note" style="margin-top:14px"><span class="tag '+cls+'">HINT</span> '+html+'</p>'; }

  renderTree();
</script>
</body>
</html>
