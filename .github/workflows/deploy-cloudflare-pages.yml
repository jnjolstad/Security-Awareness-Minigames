name: Deploy Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - "Website/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare secrets
        id: validate
        run: |
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Missing secret CLOUDFLARE_API_TOKEN"
            missing="${missing} token"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing="${missing} account"
          fi
          if [ -z "${CLOUDFLARE_PAGES_PROJECT}" ]; then
            echo "::warning::Missing secret CLOUDFLARE_PAGES_PROJECT"
            missing="${missing} project"
          fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GitHub->Cloudflare API deploy because secrets are missing. This is fine when Cloudflare Pages is connected directly to this repo."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.validate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Website --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
