<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deployed &middot; NIMBUS Secure Terminal</title>
<link rel="stylesheet" href="assets/css/nimbus.css">
</head>
<body>
<div class="center">
  <div class="panel" style="max-width:620px;text-align:center;border-color:var(--bad)">
    <div class="kicker" style="color:var(--bad)">DEPLOYMENT TIMER REACHED ZERO</div>
    <h1 style="font-size:34px;margin:.2em 0;color:var(--bad)">&#9760; BLACKFROST DEPLOYED</h1>
    <p style="white-space:pre-wrap;margin:14px 0">The ransomware encrypted the simulated client data before the kill switch fired.

But this was a drill &mdash; nothing real was lost.</p>
    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left">
      <p style="margin:0"><b>Host options:</b></p>
      <ul class="note" style="margin:8px 0 0">
        <li>Grant <b>5 minutes overtime</b> &mdash; the team was close.</li>
        <li>Or reveal the solution and move to the debrief.</li>
      </ul>
    </div>
    <div class="btnrow" style="justify-content:center;margin-top:16px">
      <button class="btn" id="overtime" type="button">Resume console (+5 minutes)</button>
      <button class="btn ghost" id="reset" type="button">Reset terminal</button>
    </div>
  </div>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script>
  document.getElementById("overtime").addEventListener("click", function () {
    NST.addTime(5 * 60000);
    location.replace("killswitch.html");
  });
  document.getElementById("reset").addEventListener("click", function () {
    NST.reset();
    location.replace("index.html");
  });
</script>
</body>
</html>
