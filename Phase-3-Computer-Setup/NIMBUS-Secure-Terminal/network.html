<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network &middot; NIMBUS Secure Terminal</title>
<link rel="stylesheet" href="assets/css/nimbus.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo"></span> NIMBUS <small>NETWORK</small></div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--</div>
  <a class="btn ghost" href="desktop.html">&larr; Desktop</a>
</div>

<div class="wrap">
  <div class="panel">
    <h2>Wi-Fi Site Survey</h2>
    <div class="sub">Approved NIMBUS networks:
      <span class="mono" id="approved"></span>. Anything else is rogue. An <b>evil twin</b> copies the name with a tiny change.</div>

    <table style="margin-top:14px">
      <tr><th>SSID</th><th>Signal</th><th>Channel</th><th>First seen</th><th>Location</th></tr>
      <tbody id="rows"></tbody>
    </table>

    <label for="ssid" style="margin-top:16px">Enter the rogue SSID</label>
    <div class="btnrow">
      <input class="input" id="ssid" placeholder="type the impostor network name" style="max-width:320px">
      <button class="btn" id="go">Flag rogue AP</button>
    </div>
    <div class="msg" id="m"></div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script>
  NST.require("usb", "files.html");
  NST.bindClock("clock");
  var C = NIMBUS_CONFIG;
  document.getElementById("approved").textContent = C.approvedSSIDs.join("  \u2022  ");

  document.getElementById("rows").innerHTML = C.wifiSurvey.map(function (w) {
    return '<tr><td class="mono">'+NST.esc(w.ssid)+'</td><td>'+w.signal+
      '</td><td>'+w.channel+'</td><td>'+NST.esc(w.seen)+'</td><td>'+NST.esc(w.location)+'</td></tr>';
  }).join("");

  document.getElementById("go").addEventListener("click", function () {
    var v = NST.norm(document.getElementById("ssid").value);
    if (!v) return;
    if (v === NST.norm(C.rogueSSID)) {
      NST.mark("rogue");
      NST.show("m","good","&#9888; Rogue access point confirmed: <b>"+NST.esc(C.rogueSSID)+"</b> " +
        "(an evil twin of "+NST.esc(C.approvedSSIDs[0])+"). Broadcasting from: <b>"+NST.esc(C.rogueLocation)+"</b>. " +
        "Your suspect works at the contractor bench.");
    } else if (C.approvedSSIDs.map(NST.norm).indexOf(v) > -1) {
      NST.show("m","err","That's an <b>approved</b> NIMBUS network. Look for the impostor with a swapped character.");
    } else {
      NST.show("m","err","Not the rogue AP. Compare each name to the approved list \u2014 one letter is different.");
    }
  });
</script>
</body>
</html>
